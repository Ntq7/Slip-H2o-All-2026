<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMIUM KIDS - Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="assets/images3/logo1.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');

        body { 
            font-family: 'Prompt', sans-serif; 
            -webkit-font-smoothing: antialiased;
            background-color: #0B1121; 
            color: #f8fafc;
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row selection:bg-indigo-500 selection:text-white">

    <!-- ========================================== -->
    <!-- เมนูด้านซ้าย (Sidebar) -->
    <!-- ========================================== -->
    <aside class="w-full md:w-[300px] bg-[#111624] border-b md:border-b-0 md:border-r border-slate-800 flex flex-col shrink-0 h-screen sticky top-0 z-20 shadow-2xl">
        
        <!-- ข้อมูลผู้ใช้ -->
        <div class="p-6 pb-4 border-b border-slate-800/50">
            <div class="flex items-center gap-4 mb-5">
                <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                    <i class="bi bi-person-fill text-white text-xl"></i>
                </div>
                <div>
                    <div class="text-[11px] text-slate-400 font-medium">เข้าสู่ระบบโดย</div>
                    <div class="text-[15px] font-bold text-white tracking-wide" id="userProfileName">กำลังโหลด...</div>
                </div>
            </div>

            <div class="bg-[#161D2D] rounded-2xl p-4 border border-slate-700/50 relative overflow-hidden">
                <div class="flex items-center gap-2 mb-3">
                    <div class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </div>
                    <span class="text-[13px] font-bold text-emerald-400">สถานะ: ปกติ</span>
                </div>
                
                <div class="space-y-2.5">
                    <div>
                        <div class="text-[11px] text-slate-400 font-medium mb-0.5">วันหมดอายุ</div>
                        <div class="text-[13px] font-semibold text-slate-200" id="userExpireDate">ตรวจสอบข้อมูล...</div>
                    </div>
                    <div>
                        <div class="text-[11px] text-slate-400 font-medium mb-0.5">เหลือเวลา</div>
                        <div class="text-[14px] font-bold text-yellow-400 drop-shadow-[0_0_5px_rgba(250,204,21,0.3)]" id="userTimeLeft">คำนวณ...</div>
                    </div>
                </div>
            </div>

            <button onclick="alert('ระบบใช้งานปกติครับ')" class="w-full mt-4 py-2.5 rounded-xl bg-[#1A2234] hover:bg-[#1E293B] border border-slate-700 text-slate-300 hover:text-white text-[13px] font-medium transition-all duration-300 flex items-center justify-center gap-2">
                <i class="bi bi-plus-lg"></i> ต่ออายุการใช้งาน
            </button>
        </div>

        <div class="px-4 py-4 space-y-2 flex-1 overflow-y-auto custom-scrollbar">
            <button class="w-full flex items-center gap-4 py-3.5 px-4 rounded-xl cursor-default bg-[#4F39F6] border border-[#6B57FF] shadow-[0_0_15px_rgba(79,57,246,0.4)] relative overflow-hidden group transition-all duration-300">
                <div class="w-9 h-9 bg-white/20 backdrop-blur-md rounded-lg p-1.5 flex-shrink-0 flex items-center justify-center border border-white/20">
                    <img src="assets/images3/logo1.png" class="w-full h-full object-contain drop-shadow-sm">
                </div>
                <span class="text-white font-bold text-[14px] tracking-wide text-left relative z-10">PREMIUM KIDS</span>
            </button>
        </div>
        
        <div class="p-5 border-t border-slate-800 bg-[#0F1423]">
            <button onclick="window.location.href='index.html'" class="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-transparent hover:bg-white/5 border border-slate-700 hover:border-slate-500 text-slate-300 hover:text-white text-[14px] font-medium transition-all duration-300 group">
                <i class="bi bi-box-arrow-left text-lg group-hover:-translate-x-1 transition-transform text-[#F43F5E]"></i>
                กลับหน้าหลัก (Dashboard)
            </button>
        </div>
    </aside>

    <!-- ========================================== -->
    <!-- พื้นที่แสดงข้อมูลหลัก (Main Content) -->
    <!-- ========================================== -->
    <main id="state-dashboard" class="flex-1 p-6 md:p-10 h-screen overflow-y-auto custom-scrollbar relative z-10">
        
        <div class="max-w-[1000px] mx-auto w-full mb-8">
            <h2 id="dashboard-header-title" class="text-2xl font-bold tracking-wide text-left">
                <span class='text-transparent bg-clip-text bg-gradient-to-r from-[#9F8CFF] to-[#D5B8FF]'>เลือกระบบที่ต้องการดำเนินการ</span>
            </h2>
            <div class="h-1 w-16 bg-gradient-to-r from-[#7B61FF] to-[#5138ED] rounded-full mt-3"></div>
        </div>

        <!-- กล่องวางการ์ด -->
        <div id="dashboard-grid" class="max-w-[1000px] mx-auto w-full"></div>
    </main>

    <!-- ========================================== -->
    <!-- หน้า 2: แบบฟอร์มตรวจสอบ (Verification) -->
    <!-- ========================================== -->
    <div id="state-verification" class="hidden fixed inset-0 z-[100] w-full h-[100dvh] flex-col items-center justify-center bg-[url('assets/images/logo3.png')] bg-cover bg-center bg-no-repeat">
        
        <div class="absolute inset-0 bg-[#0B1121]/80 backdrop-blur-[8px] z-0"></div>

        <button class="fixed top-6 left-6 z-50 flex items-center gap-2 px-4 py-2 bg-slate-800/80 backdrop-blur-md border border-slate-600 hover:bg-[#0F767D] hover:border-[#0F767D] text-white text-sm font-semibold rounded-lg transition-all shadow-lg" onclick="goToDashboard()">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            กลับหน้าหลัก
        </button>

        <div class="relative w-full max-w-[500px] z-10 px-4 fade-in">
            <div class="bg-white rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] overflow-hidden py-10 px-8 sm:px-10">
                <div class="flex flex-col items-center justify-center gap-3 mb-8 pb-6 border-b border-slate-100">

                    <img id="verify-logo" src="assets/images3/logo1.png" alt="Logo" class="h-[90px] w-auto object-contain drop-shadow-sm mb-1">
                    <h1 class="text-2xl font-bold text-[#0052CC] tracking-wide text-center uppercase" id="form-title">AI SMART CONTRACT</h1>
                </div>

                <form id="verification-form" class="space-y-7">
                    <div>
                        <label class="block text-[15px] text-slate-800 mb-2 font-medium">รหัสร้านค้า:</label>
                        <input type="text" id="shop-id" required placeholder="" 
                               class="w-full px-4 py-3.5 rounded border border-slate-300 focus:ring-2 focus:ring-[#0F767D]/50 focus:border-[#0F767D] transition-colors bg-white outline-none text-slate-700 text-base shadow-sm">
                    </div>

                    <div>
                        <label class="block text-[15px] text-slate-800 mb-2 font-medium">Slip:</label>
                        <div id="drop-zone" tabindex="0" class="mt-1 flex flex-col items-center justify-center min-h-[200px] p-2 bg-white border-2 border-dashed border-slate-300 rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-[#0F767D]/50 relative cursor-pointer">
                            <div id="drop-zone-content" class="text-center w-full py-8 pointer-events-none">
                                <span class="text-slate-600 text-base font-medium block">วางรูปภาพที่คัดลอกวางที่นี่</span>
                                <span class="text-slate-400 text-sm block mt-1.5">(กด Ctrl+V เพื่อวางรูปภาพ)</span>
                            </div>
                            <img id="form-preview-image" src="" alt="Preview" class="hidden max-h-56 object-contain rounded shadow-sm border border-slate-200">
                            <input id="file-upload" name="file-upload" type="file" class="sr-only" accept="image/*" required>
                        </div>
                    </div>

                    <div class="pt-6 flex justify-center">
                        <button type="submit" id="submit-btn" class="px-14 py-3 rounded bg-[#006A60] hover:bg-[#00554D] text-white text-[15px] font-medium transition-all shadow-md active:scale-95 tracking-wide">
                            ตรวจสอบ
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ป๊อปอัป: กำลังโหลด (Loading) -->
    <!-- ========================================== -->
    <div id="loading-overlay" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-black/80 backdrop-blur-sm fade-in px-4">
        <div class="bg-[#111827] border border-slate-700 rounded-2xl p-6 w-full max-w-[280px] flex flex-col items-center shadow-2xl">
            <h3 class="text-white font-medium mb-5 flex items-center gap-2 text-[14px]">
                <svg class="animate-spin h-5 w-5 text-[#5B4CFF]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                ระบบกำลังประมวลผล...
            </h3>
            <div class="w-full bg-[#1A2234] rounded-full h-2 mb-1.5 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-[#5B4CFF] to-[#0F767D] h-2 rounded-full transition-all duration-300 relative" style="width: 0%">
                    <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                </div>
            </div>
            <p class="text-slate-400 text-[11px] w-full text-right font-mono" id="progress-text">0%</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ป๊อปอัป: แสดงผลลัพธ์ (Result) -->
    <!-- ========================================== -->
    <div id="result-overlay" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-[#0B1121]/40 backdrop-blur-[5px] px-4 fade-in">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-[500px] p-8 sm:p-10 flex flex-col items-center pop-up">
            <div class="flex flex-col items-center justify-center gap-2 mb-8">
                <img id="result-form-logo" src="assets/images3/logo1.png" alt="Logo" class="h-[80px] w-auto object-contain drop-shadow-sm mb-1">
                <h1 class="text-2xl font-bold text-[#0052CC] tracking-wide uppercase" id="result-head-title">PREMIUM KIDS</h1>
            </div>
            
            <h2 id="result-title" class="text-xl font-bold mb-4">ผลการตรวจสอบรหัสสำคัญ</h2>
            <p class="text-base text-slate-800 font-medium mb-6">รหัสร้านค้า: <span id="result-shop-id" class="font-normal text-slate-700"></span></p>

            <div class="w-full border border-slate-200 rounded p-2 mb-6 bg-white shadow-inner">
                <div class="w-full h-72 bg-slate-50 flex items-center justify-center overflow-hidden rounded-sm relative">
                    <img id="result-image" src="" alt="Verified Slip" class="max-w-full max-h-full object-contain">
                </div>
            </div>

            <div id="result-message-box" class="w-full text-center leading-relaxed text-[15px]"></div>
            
            <button onclick="closeResult()" class="mt-8 text-slate-400 hover:text-slate-600 text-sm font-medium underline underline-offset-4 transition-colors">
                คลิกเพื่อปิด / ตรวจสอบรายการใหม่
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ระบบสคริปต์ต่างๆ -->
    <!-- ========================================== -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/security.js"></script>
    <script src="js/ai_contract.js"></script>

    <script src="js/utils.js"></script>
    <script src="js/exp.js"></script> 

    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { auth, dbFirestore } from "./js/firebase-config.js"; 
        
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const docRef = doc(dbFirestore, "users", user.uid);
                    const docSnap = await getDoc(docRef);

                    let displayName = user.email.split('@')[0];

                    if (docSnap.exists()) {
                        const userData = docSnap.data();
                        if(userData.username) displayName = userData.username;

                        if (userData.expireAt) {
                            let realExpireDate = new Date(userData.expireAt);
                            if (window.expireUtils) {
                                document.getElementById('userExpireDate').innerText = window.expireUtils.formatExpireAt(realExpireDate, {withTime: true});
                                document.getElementById('userTimeLeft').innerText = window.expireUtils.getTimeLeftText(realExpireDate);
                            } else {
                                document.getElementById('userExpireDate').innerText = realExpireDate.toLocaleDateString('th-TH');
                                document.getElementById('userTimeLeft').innerText = "คำนวณวันหมดอายุ...";
                            }
                        } else {
                            document.getElementById('userExpireDate').innerText = "ตลอดชีพ";
                            document.getElementById('userTimeLeft').innerText = "ไม่จำกัด";
                        }
                    }
                    
                    document.getElementById('userProfileName').innerText = displayName.toUpperCase();
                    
                } catch (error) {
                    console.error("❌ Error fetching user data:", error);
                    document.getElementById('userProfileName').innerText = user.email;
                }
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
